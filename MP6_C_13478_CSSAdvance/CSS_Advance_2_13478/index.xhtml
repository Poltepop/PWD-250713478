<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="style.css" type="text/css" />
    <title>Registrasi Peserta Kompetisi</title>
</head>

<body>
    <div class="container">
        <h1>Formulir Pendaftaran Kompetisi</h1>

        <form action="" method="post" enctype="multipart/form-data">
            <fieldset>
                <legend>
                    <h2>Profil Tim</h2>
                </legend>
                <table cellspacing="4" cellpadding="4">
                    <tr>
                        <td>
                            <label for="nama_tim"><strong>Nama Regu</strong></label>
                        </td>
                        <td>
                            <input type="text" id="nama_tim" name="nama_tim" size="30" placeholder="example"/>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="nama_ketua"><strong>Ketua Regu</strong></label>
                        </td>
                        <td>
                            <input type="text" id="nama_ketua" name="nama_ketua" size="30" placeholder="example"/>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="jumlah_anggota"><strong>Total Anggota</strong></label>
                        </td>
                        <td>
                            <input type="text" id="jumlah_anggota" name="jumlah_anggota" size="30" placeholder="0"/>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="prodi_lomba"><strong>Jurusan / Prodi</strong></label>
                        </td>
                        <td>
                            <select id="prodi_lomba" name="prodi_lomba">
                                <option>Teknik Informatika</option>
                                <option>Sistem Informasi</option>
                                <option>Teknik Industri</option>
                            </select>
                        </td>
                    </tr>
                </table>
            </fieldset>
            <br />
            <fieldset>
                <legend>
                    <h2>Kategori &amp; Cabang</h2>
                </legend>
                <table cellspacing="4" cellpadding="4">
                    <tr>
                        <td>
                            <strong>Tipe Kepesertaan</strong>
                        </td>
                        <td>
                            <input type="radio" id="individu" name="kategori" value="Individu" />
                            <label for="individu">Individu</label>
                            <input type="radio" id="kelompok" name="kategori" value="Kelompok" />
                            <label for="kelompok">Kelompok</label>
                        </td>
                    </tr>
                    <tr>
                        <td style="text-align: left; vertical-align: middle;">
                            <strong>Cabang Lomba</strong>
                        </td>
                        <td>
                            <p>
                                <input type="checkbox" id="programming" name="bidang" value="Programming" />
                                <label for="programming">Pemrograman (Programming)</label>
                            </p>
                            <p>
                                <input type="checkbox" id="uiux" name="bidang" value="UI/UX Design" />
                                <label for="uiux">Desain UI/UX</label>
                            </p>
                            <p>
                                <input type="checkbox" id="karyatulis" name="bidang" value="Karya Tulis" />
                                <label for="karyatulis">Karya Tulis Ilmiah</label>
                            </p>
                        </td>
                    </tr>
                </table>
            </fieldset>
            <br />
            <fieldset>
                <legend>
                    <h2>Detail Karya</h2>
                </legend>
                <table cellspacing="4" cellpadding="4">
                    <tr>
                        <td style="text-align: left; vertical-align: middle;">
                            <label for="deskripsi_karya"><strong>Sinopsis Karya</strong></label>
                        </td>
                        <td>
                            <textarea id="deskripsi_karya" name="deskripsi_karya" rows="6" cols="30"></textarea>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="file_karya"><strong>Unggah Berkas Karya</strong></label>
                        </td>
                        <td>
                            <input type="file" id="file_karya" name="file_karya" />
                        </td>
                    </tr>
                </table>
            </fieldset>
            <input type="submit" name="daftar" value="Kirim Pendaftaran" />
        </form>
    </div>
</body>

</html>
